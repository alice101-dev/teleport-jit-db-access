# Receives Teleport audit events from the event handler and posts two kinds of
# Slack alert: risky database queries and security events.

<source>
  @type http
  port 8888

  # Only the event handler holds the client certificate.
  <transport tls>
    client_cert_auth true
    ca_path /certs/ca.crt
    cert_path /certs/server.crt
    private_key_path /certs/server.key
  </transport>

  <parse>
    @type json
    json_parser oj
    # Time format used by the event handler.
    time_type string
    time_format %Y-%m-%dT%H:%M:%S
    keep_time_key true
  </parse>
</source>

# Every event is checked against both rule sets.
<match events.log>
  @type copy
  copy_mode shallow

  <store>
    @type relabel
    @label @QUERIES
  </store>

  <store>
    @type relabel
    @label @SECURITY
  </store>
</match>

# Session recording events are not used for alerts.
<match session.**>
  @type null
</match>

<label @QUERIES>
  # Plain queries carry their SQL in db_query, prepared statements in query.
  <filter **>
    @type record_transformer
    enable_ruby true
    <record>
      sql ${record["db_query"] || record["query"] || ""}
    </record>
  </filter>

  # Risky: a statement that changes data, structure or privileges, runs code,
  # or copies data out. Edit the second pattern to change the rule. It matches
  # wherever a statement can begin (after ";", in parentheses, after a comment,
  # after EXPLAIN ANALYZE or PREPARE ... AS) and does not strip strings, so a
  # statement cannot be hidden in one. Not caught: a large SELECT, or a SELECT
  # that calls a function with side effects.
  <filter **>
    @type grep
    <regexp>
      key event
      pattern /\Adb\.session\.(query|postgres\.statements\.parse)\z/
    </regexp>
    <regexp>
      key sql
      pattern /(?:\A|[;()]|\*\/|--[^\r\n]*[\r\n]|\b(?:ANALY[SZ]E|VERBOSE|AS))\s*(?:ALTER|CALL|COPY|CREATE|DELETE|DO|DROP|GRANT|INSERT|MERGE|REASSIGN|REVOKE|TRUNCATE|UPDATE)\b/i
    </regexp>
  </filter>

  # Slack message. Long queries are cut; the full text stays in the audit log.
  # uid is kept for the once filter below.
  <filter **>
    @type record_transformer
    enable_ruby true
    renew_record true
    keep_keys uid
    <record>
      text ${"*User:* " + record["user"].to_s + "\n*User database:* " + record["db_user"].to_s + "\n*Database:* " + record["db_service"].to_s + " / " + record["db_name"].to_s + "\n*Time:* " + (Time.parse(record["time"].to_s).getlocal("+07:00").strftime("%Y-%m-%d %H:%M:%S WIB") rescue record["time"].to_s) + "\n*Session:* " + record["sid"].to_s + (record["db_query_parameters"].to_a.empty? ? "" : "\n*Parameters:* " + record["db_query_parameters"].to_a.join(", ")) + "\n```" + (record["sql"].to_s.length > 2500 ? record["sql"].to_s[0, 2500] + "\n... (truncated)" : record["sql"].to_s) + "```"}
    </record>
  </filter>

  <match **>
    @type relabel
    @label @SLACK
  </match>
</label>

<label @SECURITY>
  # Rules and message format: plugins/filter_security_alert.rb.
  <filter **>
    @type security_alert
  </filter>

  <match **>
    @type relabel
    @label @SLACK
  </match>
</label>

<label @SLACK>
  # One alert per audit event, keyed on its unique id (plugins/filter_once.rb).
  <filter **>
    @type once
    key uid
    path /fluentd/log/alerted-events
  </filter>

  # A Slack webhook takes only the message itself.
  <filter **>
    @type record_transformer
    remove_keys uid
  </filter>

  <match **>
    @type copy

    # Also visible with `docker compose logs fluentd`.
    <store>
      @type stdout
    </store>

    <store>
      @type http
      endpoint "#{File.read('/run/secrets/slack-webhook-url').strip}"
      content_type application/json
      open_timeout 5
      read_timeout 10
      <format>
        @type json
      </format>
      # One message per request: a Slack webhook takes a single JSON object.
      <buffer>
        flush_mode immediate
        chunk_limit_records 1
        retry_max_times 5
      </buffer>
    </store>
  </match>
</label>
